<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="A five stage pipeline running left to right, Scan then Analyse then Propose then Fix then Ask, where the arrow entering Ask stops and no arrow leaves it, because destructive changes wait for the operator.">
  <rect width="900" height="220" rx="10" fill="#08090a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g fill="none" stroke="#00f3ff" stroke-width="2">
      <rect x="24" y="58" width="140" height="58" rx="8"/>
      <rect x="196" y="58" width="140" height="58" rx="8"/>
      <rect x="368" y="58" width="140" height="58" rx="8"/>
      <rect x="540" y="58" width="140" height="58" rx="8"/>
    </g>
    <rect x="712" y="58" width="164" height="58" rx="8" fill="none" stroke="#ff00ea" stroke-width="3"/>
    <g font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="94" y="93">Scan</text>
      <text x="266" y="93">Analyse</text>
      <text x="438" y="93">Propose</text>
      <text x="610" y="93">Fix</text>
    </g>
    <text x="794" y="93" font-size="17" font-weight="600" fill="#ff54eb" text-anchor="middle">Ask</text>
    <g font-size="12" fill="#c67eff" text-anchor="middle">
      <text x="94" y="140">kanit/</text>
      <text x="266" y="140">Report</text>
      <text x="438" y="140">Prompts</text>
      <text x="610" y="140">Audit Note</text>
      <text x="794" y="140">Approval List</text>
    </g>
    <g stroke="#00f3ff" stroke-width="2" fill="none">
      <path d="M164 87 h20" marker-end="url(#a)"/>
      <path d="M336 87 h20" marker-end="url(#a)"/>
      <path d="M508 87 h20" marker-end="url(#a)"/>
    </g>
    <path d="M680 87 h18" stroke="#ff00ea" stroke-width="3" fill="none"/>
    <line x1="700" y1="70" x2="700" y2="104" stroke="#ff00ea" stroke-width="4" stroke-linecap="round"/>
    <text x="450" y="184" font-size="13" fill="#71717a" text-anchor="middle">Nothing leaves Ask without you.</text>
    <text x="24" y="36" font-size="13" font-weight="600" fill="#00f3ff">REPOWARDEN &#183; AUDIT PIPELINE</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00f3ff"/>
    </marker>
  </defs>
</svg>
